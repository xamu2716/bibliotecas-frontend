<main>
  <h1>Bibliotecas y libros</h1>

  <div class="layout">
    <aside>
      <app-biblioteca-form (creada)="cargar()" />
    </aside>

    <section>
      <h2>Libros</h2>
      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }
      <app-libros-tabla [bibliotecas]="bibliotecas()" />
    </section>
  </div>
</main>
