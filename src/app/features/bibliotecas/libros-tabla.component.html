<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Año</th>
        <th>Biblioteca</th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.id) {
        <tr>
          <td>{{ fila.titulo }}</td>
          <td>{{ fila.autor }}</td>
          <td>{{ fila.anioPublicacion }}</td>
          <td>{{ fila.biblioteca }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="vacio">No hay libros registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
